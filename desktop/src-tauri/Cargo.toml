[package]
name = "keylink-desktop"
version = "1.0.0"
description = "KeyLink Desktop Agent - Wireless Keyboard and Mouse Server"
authors = ["KeyLink Team"]
edition = "2021"

[lib]
name = "keylink_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon", "unstable", "image-ico", "image-png"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
uuid = { version = "1.8", features = ["v4"] }
local-ip-address = "0.6"
mdns-sd = "0.11"
rand = "0.8"
jpeg-encoder = "0.7.1"
qrcode = { version = "0.14.1", default-features = false }
sha2 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows Win32 API is handled via lightweight, high-performance direct FFI in platform::windows

[target.'cfg(target_os = "macos")'.dependencies]
# CoreGraphics and CoreFoundation for macOS platform driver
core-foundation = "0.9"

[patch.crates-io]
wry = { path = "../crates/wry" }

